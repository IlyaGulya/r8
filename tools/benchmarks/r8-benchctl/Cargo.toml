[package]
name = "r8-benchctl"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
walkdir = "2.5"
tempfile = "3.20"
tar = "0.4"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
